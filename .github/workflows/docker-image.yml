name: Docker Image CI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hrzn-hosting-1738589458329
  GAR_LOCATION: europe
  REPOSITORY: cluster-artifacts
  VERSION: ${{ github.ref_name }}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1013735017656/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "github-actions@hrzn-hosting-1738589458329.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            $GAR_LOCATION-docker.pkg.dev

      - name: Build the Docker image
        run: docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/docs:$VERSION .

      - name: Publish to Google Artifact Registry
        run: docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/docs:$VERSION