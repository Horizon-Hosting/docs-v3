name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Lint Markdown
        run: bun run lint:md

      - name: Lint Links
        run: bun run lint:links

      - name: Lint Stubs
        run: bun run lint:stubs

      - name: Lint Document Types
        run: bun run lint:types

      - name: Type Check
        run: bun run types:check
